<!-- @dsCard group="Spacing" viewport="700x150" name="Raios e bordas" subtitle="6px padrão; bordas de marca 3/4/6px" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;background:var(--cor-fundo)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:flex;flex-direction:column;gap:6px;width:150px}.sw b{display:block;height:64px;border-radius:var(--raio);border:1px solid var(--borda)}.sw span{font:500 .85rem var(--fonte)}.sw code{font-size:.75rem;color:var(--texto-2)}.l{font-size:.75rem;color:var(--texto-2);font-family:var(--fonte-mono)}</style></head><body><div class="r" style="align-items:flex-start"><div class="sw" style="width:110px"><b style="border-radius:6px;background:var(--superficie);border:1px solid var(--borda-forte)"></b><code>--raio</code></div><div class="sw" style="width:110px"><b style="border-radius:12px 12px 0 0;background:var(--superficie);border:1px solid var(--borda-forte)"></b><code>--raio-folha</code></div><div class="sw" style="width:110px"><b style="border-radius:999px;background:var(--superficie);border:1px solid var(--borda-forte)"></b><code>--raio-pilula</code></div><div class="sw" style="width:110px"><b style="border-radius:2px;background:var(--superficie);border:1px solid var(--borda-forte)"></b><code>--raio-fita</code></div><div class="sw" style="width:110px"><b style="background:var(--superficie);border-left:6px solid var(--cor-marca)"></b><code>etiqueta 6px</code></div><div class="sw" style="width:110px"><b style="background:var(--cor-estrutura);border:0;border-right:4px solid var(--cor-marca)"></b><code>menu 4px</code></div></div></body></html>
