<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;background:var(--cor-fundo)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:flex;flex-direction:column;gap:6px;width:150px}.sw b{display:block;height:64px;border-radius:var(--raio);border:1px solid var(--borda)}.sw span{font:500 .85rem var(--fonte)}.sw code{font-size:.75rem;color:var(--texto-2)}.l{font-size:.75rem;color:var(--texto-2);font-family:var(--fonte-mono)}</style></head><body><div class="r"><div class="sw"><b style="background:var(--superficie)"></b><span>Superfície (cartão)</span><code>--superficie</code></div><div class="sw"><b style="background:var(--borda)"></b><span>Borda 30%</span><code>--borda</code></div><div class="sw"><b style="background:var(--borda-forte)"></b><span>Borda forte 55%</span><code>--borda-forte</code></div><div class="sw"><b style="background:var(--marca-hover)"></b><span>Cobre hover</span><code>--marca-hover</code></div><div class="sw"><b style="background:var(--marca-suave)"></b><span>Cobre suave 12%</span><code>--marca-suave</code></div><div class="sw"><b style="background:var(--menu-ativo)"></b><span>Menu ativo</span><code>--menu-ativo</code></div></div></body></html>
