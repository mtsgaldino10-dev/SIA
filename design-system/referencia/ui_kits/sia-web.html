<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warefly — desktop</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="../../ui_kits/sia-web/dados.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="../../ui_kits/sia-web/Shell.jsx"></script>
<script type="text/babel" src="../../ui_kits/sia-web/Painel.jsx"></script>
<script type="text/babel" src="../../ui_kits/sia-web/Pedidos.jsx"></script>
<script type="text/babel" src="../../ui_kits/sia-web/Guia.jsx"></script>
<script type="text/babel" src="../../ui_kits/sia-web/Operacao.jsx"></script>
<script type="text/babel" src="../../ui_kits/sia-web/Cadastros.jsx"></script>
<script type="text/babel">
function App() {
  const [tela, setTela] = React.useState(() => localStorage.getItem('sia-web-tela') || 'inicio');
  const ir = (t) => { setTela(t); localStorage.setItem('sia-web-tela', t); window.scrollTo(0, 0); };
  if (tela === 'login') return <Login entrar={() => ir('inicio')} />;
  if (tela === 'guia') return <Guia ir={ir} />;
  const ativo = { pedido: 'pedidos' }[tela] || tela;
  const T = { inicio: Painel, painel: Painel, pedidos: Pedidos, pedido: PedidoDetalhe, saldo: Saldo, remessas: Remessas, divergencias: Divergencias, materiais: ImportarMateriais }[tela];
  return <Shell ativo={ativo} onNavegar={ir}>{T ? <T ir={ir} /> : <window.SIADesignSystem_ad870b.Vazio>Tela fora do escopo deste kit.</window.SIADesignSystem_ad870b.Vazio>}</Shell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
